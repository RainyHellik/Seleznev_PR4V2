<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задача 3 — Перевод килобайтов в терабайты</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-box { width: 340px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 15px; padding: 10px; background: #f4f4f4; font-weight: bold; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="form-box">
    <h3>Перевод Кб в Тб</h3>
    
    <div class="input-group">
        <label for="kb">Количество килобайтов (Кб):</label>
        <input type="number" id="kb" placeholder="Введите Кб">
    </div>

    <button type="button" onclick="calc3()">Перевести</button>

    <div class="result" id="res3">
        Кол-во терабайтов из килобайтов: — Тб
    </div>
</div>

<script>
    function calc3() {
        let kb = parseInt(document.getElementById('kb').value) || 0;
        let tb = kb / (1024 ** 3);
        document.getElementById('res3').innerText = "Кол-во терабайтов из килобайтов: " + tb + " Тб";
    }
</script>

</body>
</html>
