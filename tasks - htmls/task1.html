<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задача 1 — Длина стороны ромба</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-box { width: 320px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 15px; padding: 10px; background: #f4f4f4; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-box">
    <h3>Расчет стороны ромба</h3>
    
    <div class="input-group">
        <label for="d1">Диагональ d1:</label>
        <input type="number" id="d1" placeholder="Введите d1">
    </div>

    <div class="input-group">
        <label for="d2">Диагональ d2:</label>
        <input type="number" id="d2" placeholder="Введите d2">
    </div>

    <button type="button" onclick="calc1()">Рассчитать</button>

    <div class="result" id="res1">
        Длина стороны ромба = —
    </div>
</div>

<script>
    function calc1() {
        let d1 = parseInt(document.getElementById('d1').value) || 0;
        let d2 = parseInt(document.getElementById('d2').value) || 0;
        let a = Math.trunc((d1 + d2) / 2);
        document.getElementById('res1').innerText = "Длина стороны ромба = " + a;
    }
</script>

</body>
</html>
